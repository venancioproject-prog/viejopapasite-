<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viejo Papa | Uruguayan Parrilla & Cava - Alta Gastronomia Sul-Americana</title>
  <meta name="description" content="Viejo Papa - Parrilla Uruguaia e Cava. Cortes nobres na brasa viva, maturação dry-aged, lenhas nobres, carta de vinhos exclusiva, eventos corporativos, casamentos inesquecíveis e ambiente sofisticado em São Roque - SP.">
  
  <link rel="icon" type="image/png" href="assets/logo/logo-dark.png">

  <!-- Google Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Cinzel:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    // Mobile menu toggle
    const btn = document.getElementById('mobile-menu-btn');
    const menu = document.getElementById('mobile-menu');
    if (btn && menu) {
      btn.addEventListener('click', () => {
        menu.classList.toggle('hidden');
      });
      document.querySelectorAll('.mobile-link').forEach(link => {
        link.addEventListener('click', () => {
          menu.classList.add('hidden');
        });
      });
    }

    // Menu category filter tabs
    const tabBtns = document.querySelectorAll('.menu-tab-btn');
    const panels = document.querySelectorAll('.menu-category-panel');
    tabBtns.forEach(tBtn => {
      tBtn.addEventListener('click', () => {
        tabBtns.forEach(b => {
          b.classList.remove('bg-flame-wine', 'text-white');
          b.classList.add('bg-white', 'text-charcoal-main');
        });
        tBtn.classList.remove('bg-white', 'text-charcoal-main');
        tBtn.classList.add('bg-flame-wine', 'text-white');
        
        const target = tBtn.getAttribute('data-target');
        panels.forEach(p => {
          if (target === 'todos' || p.getAttribute('data-category') === target) {
            p.style.display = 'block';
          } else {
            p.style.display = 'none';
          }
        });
      });
    });

    // Wine Category Filter Tabs
    const wineCatTabBtns = document.querySelectorAll('.wine-cat-tab-btn');
    const wineCatPanels = document.querySelectorAll('.wine-category-panel');

    wineCatTabBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        wineCatTabBtns.forEach(b => {
          b.classList.remove('bg-flame-wine', 'text-white');
          b.classList.add('bg-white', 'text-charcoal-main');
        });
        btn.classList.remove('bg-white', 'text-charcoal-main');
        btn.classList.add('bg-flame-wine', 'text-white');

        const target = btn.getAttribute('data-target');
        wineCatPanels.forEach(panel => {
          if (target === 'todos' || panel.getAttribute('data-category') === target) {
            panel.style.display = 'block';
          } else {
            panel.style.display = 'none';
          }
        });
      });
    });

    // Lightbox for photos
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    document.querySelectorAll('.gallery-zoom').forEach(img => {
      img.addEventListener('click', () => {
        const full = img.getAttribute('data-full') || img.src;
        lightboxImg.src = full;
        lightbox.classList.add('active');
      });
    });
    function closeLightbox() {
      lightbox.classList.remove('active');
    }

  </script>
</body>
</html>
